<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doll Shop Survivors</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0718">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0c0718;position:fixed;inset:0;overscroll-behavior:none;touch-action:none;font-family:"Fredoka",ui-rounded,"Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif;color:#fff6fb}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:5;padding:3vh 4vw;gap:min(2.6vh,20px)}
.ov.on{display:flex}
#title{background:radial-gradient(ellipse at 50% 42%,rgba(18,11,36,.05) 0%,rgba(12,7,24,.3) 50%,rgba(12,7,24,.85) 100%)}
.logo{font-family:"Rubik Wet Paint","Fredoka",ui-rounded,sans-serif;font-weight:400;font-size:min(17vw,27vh);line-height:.84;color:#ffc2e6;text-shadow:0 0 .08em #ff4fa3,0 0 .35em rgba(255,79,163,.75),0 0 1em rgba(255,79,163,.4),0 .05em 0 #7a1c63;transform:rotate(-3deg);animation:neon 5s infinite}
.logo small{display:block;font-family:"Fredoka",ui-rounded,sans-serif;font-weight:700;font-size:.27em;letter-spacing:.5em;margin:.5em 0 0 .5em;color:#b9fff0;text-shadow:0 0 .25em #33d6b0,0 0 1em rgba(80,255,210,.6)}
@keyframes neon{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.55}43%{opacity:1}45%{opacity:.7}46%{opacity:1}78%{opacity:1}79%{opacity:.6}80%{opacity:1}}
.tag1{font-size:clamp(14px,2.6vh,22px);font-weight:500;color:#e6d8ff;text-shadow:0 2px 0 #120b24;margin-top:1vh}
.hint{font-size:clamp(11px,1.9vh,15px);color:#b9a2ff;letter-spacing:.04em;font-weight:500}
.btn{font-weight:700;font-size:clamp(17px,3.2vh,26px);letter-spacing:.12em;padding:.62em 1.7em;border-radius:99px;background:linear-gradient(180deg,#ff8fd0,#ff4fa3);color:#2a0b2e;box-shadow:0 0 0 4px #120b24,0 0 0 7px #ffc2e6,0 0 34px rgba(255,79,163,.75),inset 0 3px 0 rgba(255,255,255,.5);animation:pulse 1.3s ease-in-out infinite}
.btn:active{transform:scale(.95);animation:none}
.btn.ghost{background:#2f2157;color:#e6d8ff;box-shadow:0 0 0 4px #120b24,0 0 0 6px #6a58ad;animation:none;font-size:clamp(13px,2.2vh,18px)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#btns{position:absolute;top:calc(13px * var(--u,1) + 12px);right:12px;display:none;gap:8px;z-index:4}
#btns.on{display:flex}
#btns button{width:44px;height:44px;border-radius:50%;background:rgba(18,11,36,.82);border:2.5px solid #c9a7ff;display:grid;place-items:center}
#btns svg{width:20px;height:20px;fill:#fff6fb}
#bMute.off{border-color:#6a58ad}#bMute.off svg{opacity:.35}
#banner{position:absolute;left:0;right:0;top:21%;text-align:center;pointer-events:none;z-index:3;opacity:0}
#banner.go{animation:ban 3s ease-out forwards}
#bt{font-family:"Rubik Wet Paint","Fredoka",ui-rounded,sans-serif;font-size:min(9.5vw,14vh);line-height:1;color:#ffc2e6;text-shadow:0 0 .1em #ff4fa3,0 0 .5em rgba(255,79,163,.8),0 .05em 0 #5b1c63}
#bs{font-size:clamp(13px,2.6vh,22px);font-weight:600;color:#b9fff0;letter-spacing:.14em;text-transform:uppercase;margin-top:.5em;text-shadow:0 2px 0 #120b24,0 0 12px rgba(80,255,210,.6)}
@keyframes ban{0%{opacity:0;transform:scale(1.5)}9%{opacity:1;transform:scale(1)}12%{transform:scale(1.04) rotate(-1deg)}15%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.97)}}
#levelup,#pause{background:rgba(12,7,24,.8)}
.lvh span{display:block;font-family:"Rubik Wet Paint","Fredoka",sans-serif;font-size:min(8vw,10vh);line-height:1;color:#ffe58a;text-shadow:0 0 .12em #ffb300,0 0 .6em rgba(255,200,60,.6),0 .05em 0 #6b3a00}
.lvh b{font-size:clamp(12px,2.2vh,17px);letter-spacing:.3em;text-transform:uppercase;color:#e6d8ff;font-weight:600}
.cards{display:flex;gap:min(2.4vw,22px);align-items:stretch;justify-content:center;width:100%}
.card{--c:#ff8fd0;width:min(29vw,250px);border-radius:22px;padding:min(2.4vh,18px) 12px;background:linear-gradient(180deg,#43317f,#22163f);border:3px solid var(--c);box-shadow:0 0 0 4px #120b24,0 0 30px -4px var(--c),inset 0 2px 0 rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;gap:min(1vh,7px);animation:pop .4s cubic-bezier(.2,1.5,.4,1) backwards;color:#fff6fb}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
@keyframes pop{0%{transform:translateY(40px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
.card canvas{width:min(15vh,104px);height:min(15vh,104px);filter:drop-shadow(0 4px 0 rgba(18,11,36,.5))}
.card .tag{font-size:clamp(9px,1.5vh,11px);font-weight:700;letter-spacing:.14em;color:#120b24;background:var(--c);padding:2px 9px;border-radius:99px}
.card h3{font-size:clamp(14px,2.7vh,22px);font-weight:700;line-height:1.05}
.card p{font-size:clamp(11px,2vh,15px);font-weight:500;color:#d9cdfa;line-height:1.22;flex:1}
.pips{display:flex;gap:5px;min-height:11px}.pips i{width:11px;height:11px;border-radius:50%;background:#120b24;border:2px solid var(--c)}.pips i.f{background:var(--c)}.pips i.n{background:#fff;animation:blink .7s infinite}
@keyframes blink{50%{background:#120b24}}
.card:active{transform:scale(.96)}
.card.sel{animation:sel .28s forwards}.card.dim{opacity:.2;transition:opacity .2s}
@keyframes sel{40%{transform:scale(1.1);filter:brightness(1.6)}100%{transform:scale(1.04);filter:brightness(1.2)}}
.big{font-family:"Rubik Wet Paint","Fredoka",sans-serif;font-size:min(13vw,19vh);line-height:.95;color:#ffc2e6;text-shadow:0 0 .1em #ff4fa3,0 0 .5em rgba(255,79,163,.7),0 .05em 0 #5b1c63}
.big.drip{color:#ff8fa8;text-shadow:0 0 .1em #ff2244,0 0 .6em rgba(255,34,68,.8),0 .05em 0 #4a0016;animation:neon 3s infinite}
.sub{font-size:clamp(14px,2.8vh,22px);font-weight:500;color:#e6d8ff}
#over{background:radial-gradient(ellipse at 50% 40%,rgba(30,4,30,.35),rgba(10,0,16,.93) 75%)}
.stats{display:flex;gap:min(3vw,26px);flex-wrap:wrap;justify-content:center}
.stats div{min-width:92px;padding:9px 14px;border-radius:16px;background:rgba(18,11,36,.72);border:2px solid #6a58ad}
.stats b{display:block;font-size:clamp(18px,3.6vh,30px);color:#ffe58a}.stats span{font-size:clamp(10px,1.7vh,13px);letter-spacing:.12em;text-transform:uppercase;color:#c9a7ff;font-weight:600}
#win{background:linear-gradient(180deg,#ffe2a8 0%,#ffb3c9 48%,#c9a7ff 100%);overflow:hidden;animation:fadein 1.2s}
@keyframes fadein{from{opacity:0}}
#win>*{position:relative}
#win .rays{position:absolute;left:50%;top:38%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(rgba(255,255,255,.34) 0 9deg,rgba(255,255,255,0) 9deg 18deg);animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#win .big{color:#fff8e0;text-shadow:0 0 .12em #ff9d2e,0 .06em 0 #d9567f,0 0 .7em rgba(255,255,255,.9)}
#win .sub{color:#4a2466;font-weight:700}
#win .stats div{background:rgba(255,255,255,.55);border-color:#fff}#win .stats b{color:#d9367f}#win .stats span{color:#4a2466}
@media (orientation:portrait){.cards{flex-direction:column;align-items:center}.card{width:min(88vw,430px);flex-direction:row;flex-wrap:wrap;text-align:left;padding:10px 14px;gap:4px 12px}.card canvas{width:64px;height:64px}.card h3{flex:1}.card p{flex-basis:100%}.logo{font-size:23vw}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="banner"><div id="bt"></div><div id="bs"></div></div>
<div id="btns">
  <button id="bMute" aria-label="Sound"><svg viewBox="0 0 20 20"><path d="M3 7h3l5-4v14l-5-4H3zM13.5 6.5a5 5 0 010 7l-1.2-1.2a3.3 3.3 0 000-4.6z"/></svg></button>
  <button id="bPause" aria-label="Pause"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="4.5" height="14" rx="1.5"/><rect x="11.5" y="3" width="4.5" height="14" rx="1.5"/></svg></button>
</div>
<div id="title" class="ov on">
  <div class="logo">Doll Shop<small>SURVIVORS</small></div>
  <p class="tag1">Locked in overnight. They wake up when you get close.</p>
  <button id="bStart" class="btn">TAP TO START</button>
  <p class="hint">Drag anywhere to move &middot; attacks are automatic &middot; survive until dawn</p>
</div>
<div id="levelup" class="ov"><div class="lvh"><span id="lvn">LEVEL 2</span><b>Pick an upgrade</b></div><div id="cards" class="cards"></div></div>
<div id="pause" class="ov"><div class="big">PAUSED</div><button id="bResume" class="btn">KEEP PLAYING</button><button id="bQuit" class="btn ghost">START OVER</button></div>
<div id="over" class="ov"><div class="big drip">THEY GOT YOU</div><p class="sub">The dolls put you on the shelf.</p><div class="stats" id="oStats"></div><button id="bRetry" class="btn">TRY AGAIN</button></div>
<div id="win" class="ov"><div class="rays"></div><div class="big">DAWN!</div><p class="sub">You survived the night.</p><div class="stats" id="wStats"></div><button id="bAgain" class="btn">PLAY AGAIN</button></div>
<script>
'use strict';
// ---------- utils ----------
const TAU = Math.PI * 2;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

const INK = '#1a0f33', INK2 = '#2b1b4d';
const C = { pink: '#ff8fd0', hot: '#ff4fa3', mint: '#8ff5d8', lilac: '#c9a7ff', butter: '#ffe58a', blue: '#9fd4ff', white: '#fff6fb', red: '#ff5577' };
const FONT_UI = '"Fredoka", ui-rounded, "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif';
const SS = 2;

function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function sprite(w, h, ax, ay, draw, ss = SS) {
  const c = mk(w * ss, h * ss), g = c.getContext('2d');
  g.scale(ss, ss); g.translate(ax, ay); g.lineJoin = 'round'; g.lineCap = 'round'; draw(g);
  return { c, w, h, ax, ay };
}
function flipS(s) { const c = mk(s.c.width, s.c.height), g = c.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(s.c, 0, 0); return { c, w: s.w, h: s.h, ax: s.w - s.ax, ay: s.ay }; }
function whiteS(s, col = '#fff') { const c = mk(s.c.width, s.c.height), g = c.getContext('2d'); g.drawImage(s.c, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); return { c, w: s.w, h: s.h, ax: s.ax, ay: s.ay }; }
function ds(g, s, x, y, sx = 1, sy = sx) { g.drawImage(s.c, x - s.ax * sx, y - s.ay * sy, s.w * sx, s.h * sy); }

// ---------- shape helpers ----------
function fs(g, fill, lw = 2.2, stroke = INK) { if (fill) { g.fillStyle = fill; g.fill(); } if (lw) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); } }
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }
function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); }
function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function limb(g, x1, y1, x2, y2, w, col) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineWidth = w + 4; g.strokeStyle = INK; g.stroke(); g.lineWidth = w; g.strokeStyle = col; g.stroke(); }
function star(g, x, y, r, r2, n = 5, rot = -Math.PI / 2) { g.beginPath(); for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, rad = i % 2 ? r2 : r; g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); } g.closePath(); }
function heart(g, x, y, s) { g.beginPath(); g.moveTo(x, y + s * 0.9); g.bezierCurveTo(x - s * 1.5, y - s * 0.2, x - s * 0.7, y - s * 1.2, x, y - s * 0.35); g.bezierCurveTo(x + s * 0.7, y - s * 1.2, x + s * 1.5, y - s * 0.2, x, y + s * 0.9); g.closePath(); }
function moon(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0.35 * Math.PI, 1.65 * Math.PI); g.arc(x + r * 0.55, y, r * 0.78, 1.42 * Math.PI, 0.58 * Math.PI, true); g.closePath(); }

// ---------- dolls ----------
function drawEyes(g, o, hy, closed) {
  for (const s of [-1, 1]) {
    const ex = s * 6.6, ey = hy + 2.5;
    let kind = o.eyes;
    if (kind === 'mismatch') kind = s < 0 ? 'button' : 'x';
    if (kind === 'boss') kind = s < 0 ? 'glossy' : 'hollow';
    if (closed) {
      g.beginPath(); g.arc(ex, ey - 1.5, 3.8, 0.12 * Math.PI, 0.88 * Math.PI); g.lineWidth = 1.9; g.strokeStyle = INK; g.stroke();
      continue;
    }
    if (kind === 'button') {
      circ(g, ex, ey, 4.7); fs(g, o.iris || '#4b3a86', 1.8);
      g.fillStyle = INK; for (const [dx, dy] of [[-1.5, -1.5], [1.5, -1.5], [-1.5, 1.5], [1.5, 1.5]]) { circ(g, ex + dx, ey + dy, 0.85); g.fill(); }
    } else if (kind === 'x') {
      g.beginPath(); g.moveTo(ex - 3.4, ey - 3.4); g.lineTo(ex + 3.4, ey + 3.4); g.moveTo(ex + 3.4, ey - 3.4); g.lineTo(ex - 3.4, ey + 3.4); g.lineWidth = 2.3; g.strokeStyle = INK; g.stroke();
    } else if (kind === 'hollow') {
      ell(g, ex, ey, 4.3, 5.3); fs(g, '#0b0618', 1.4); circ(g, ex, ey + 0.5, 1.6); g.fillStyle = o.iris || C.hot; g.fill();
    } else {
      ell(g, ex, ey, 4.9, 5.9); fs(g, '#150a2a', 1.6);
      ell(g, ex, ey + 1, 3.5, 4.3); g.fillStyle = o.iris || C.blue; g.fill();
      circ(g, ex, ey + 1.2, 1.9); g.fillStyle = '#150a2a'; g.fill();
      g.fillStyle = '#fff'; circ(g, ex - 1.7, ey - 2, 1.6); g.fill(); circ(g, ex + 1.6, ey + 2.6, 0.8); g.fill();
    }
  }
}
function drawMouth(g, o, hy) {
  const my = hy + 9.6;
  g.lineWidth = 1.5; g.strokeStyle = INK;
  if (o.mouth === 'stitch') {
    g.beginPath(); g.moveTo(-5.5, my - 0.8); g.quadraticCurveTo(0, my + 2.8, 5.5, my - 0.8); g.stroke();
    for (let i = -1; i <= 1; i++) { const yy = my + (i ? 0 : 1.2); g.beginPath(); g.moveTo(i * 3.3, yy - 1.6); g.lineTo(i * 3.3, yy + 1.8); g.stroke(); }
  } else if (o.mouth === 'o') { ell(g, 0, my, 1.8, 2.2); fs(g, '#7a2a5c', 1.2); }
  else { g.beginPath(); g.moveTo(-3, my - 0.3); g.quadraticCurveTo(0, my + 2.6, 3, my - 0.3); g.lineWidth = 1.7; g.stroke(); }
}
function drawDoll(g, o, p = {}) {
  const sit = p.sit, hy = -44;
  g.save();
  if (sit) { for (const s of [-1, 1]) { rr(g, s * 7 - 4.5, -8, 9, 9, 4); fs(g, o.shoe); } g.translate(0, 9); }
  else {
    for (const s of [-1, 1]) {
      const up = p.step === s ? -3.5 : 0;
      rr(g, s * 5.5 - 3.2, -13 + up, 6.4, 11, 3); fs(g, o.leg || o.skin);
      if (o.stripes) { g.fillStyle = o.stripes; g.fillRect(s * 5.5 - 2.4, -10 + up, 4.8, 1.8); g.fillRect(s * 5.5 - 2.4, -6.4 + up, 4.8, 1.8); }
      if (o.platform) { rr(g, s * 5.5 - 5.4, -7 + up, 10.8, 9, 3); fs(g, o.shoe); g.fillStyle = C.hot; g.fillRect(s * 5.5 - 4.4, -1.2 + up, 8.8, 2); }
      else { rr(g, s * 5.5 - 5, -4.5 + up, 10, 6.5, 3); fs(g, o.shoe); }
    }
  }
  // back hair
  if (o.hairStyle === 'ringlets') { ell(g, 0, hy + 5, 20.5, 19); fs(g, o.hair); for (const s of [-1, 1]) { circ(g, s * 17, hy + 16, 5.4); fs(g, o.hair); } }
  if (o.hairStyle === 'pigtails') for (const s of [-1, 1]) { circ(g, s * 19.5, hy + 3, 8.5); fs(g, o.hair); circ(g, s * 22, hy + 13, 5); fs(g, o.hair); }
  if (o.hairStyle === 'bun') { circ(g, 0, hy - 17, 7.6); fs(g, o.hair); }
  if (o.hairStyle === 'buns') { rr(g, -18, hy - 8, 36, 33, 13); fs(g, o.hair); for (const s of [-1, 1]) { circ(g, s * 13.5, hy - 15, 7.8); fs(g, o.hair); } }
  if (o.key) {
    g.beginPath(); g.moveTo(-7, -23); g.lineTo(-16, -23); g.lineWidth = 6; g.strokeStyle = INK; g.stroke(); g.lineWidth = 2.6; g.strokeStyle = C.butter; g.stroke();
    ell(g, -21, -23, 4.2, 7); fs(g, C.butter, 2); ell(g, -21, -23, 1.4, 3.2); g.fillStyle = INK; g.fill();
  }
  // arms
  const sh = -29;
  for (const s of [-1, 1]) {
    const hx = p.arms === 'out' ? s * 20 : s * 12.5, hY = p.arms === 'out' ? sh - 4 : sh + 13;
    limb(g, s * 7.5, sh, hx, hY, 5, o.sleeve || o.skin);
    circ(g, hx, hY, 3.1); fs(g, o.skin, 1.6);
  }
  // body
  if (o.body === 'leotard') {
    rr(g, -6.5, -33, 13, 19, 5); fs(g, o.dress);
    ell(g, 0, -15, 18.5, 6.5); fs(g, o.dress2, 2);
    ell(g, 0, -16.5, 12, 3.6); g.fillStyle = 'rgba(255,255,255,.45)'; g.fill();
  } else {
    g.beginPath(); g.moveTo(-8, -33); g.lineTo(8, -33); g.lineTo(16, -11);
    for (let i = 0; i < 4; i++) { const x0 = 16 - i * 8; g.quadraticCurveTo(x0 - 4, -4, x0 - 8, -11); }
    g.closePath(); fs(g, o.dress);
    g.save(); g.clip();
    if (o.dress2) { g.fillStyle = o.dress2; g.fillRect(-20, -17.5, 40, 3.6); if (o.apron) { rr(g, -5, -31, 10, 13, 3); g.fill(); } }
    g.fillStyle = 'rgba(255,255,255,.16)'; g.fillRect(-20, -34, 13, 30);
    g.restore();
    if (o.patch) { g.save(); g.translate(7, -22); g.rotate(0.2); g.fillStyle = o.patch; g.fillRect(-3.5, -3.5, 7, 7); g.lineWidth = 1; g.strokeStyle = INK; g.setLineDash([1.6, 1.6]); g.strokeRect(-3.5, -3.5, 7, 7); g.restore(); }
    if (o.heart) { heart(g, 0, -24, 3.6); fs(g, o.heart, 1.2); }
    if (o.collar) { ell(g, 0, -32, 8.5, 3.3); fs(g, o.collar, 1.6); }
    if (o.choker) { g.beginPath(); g.moveTo(-6, -31.5); g.lineTo(6, -31.5); g.lineWidth = 3; g.strokeStyle = '#0b0618'; g.stroke(); circ(g, 0, -30, 1.7); g.fillStyle = C.hot; g.fill(); }
  }
